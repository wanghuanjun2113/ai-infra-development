current_framework: xllm

frameworks:
  xllm:
    enabled: true
    path: code/xllm
    adapter: frameworks/xllm.md
    git:
      origin: https://github.com/wanghuanjun2113/xllm.git
      upstream: https://github.com/jd-opensource/xllm.git
      branch: preview/qwen3.5-qwen3.6
      commit: cfc94a06

  vllm-ascend:
    enabled: false
    path: code/vllm-ascend
    adapter: frameworks/vllm-ascend.md
    git:
      origin: git@github.com:your-org/vllm-ascend.git
      branch: main

  sglang:
    enabled: false
    path: code/sglang
    adapter: frameworks/sglang.md
    git:
      origin: git@github.com:your-org/sglang.git
      branch: main

models:
  qwen35_27b:
    path: /home/data/weights/Qwen35-27B
  qwen35_27b_mtp:
    path: /home/data/weights/Qwen35-27B-mtp

datasets:
  ceval:
    path: /shared/inference/datasets/ceval
  mmlu:
    path: /shared/inference/datasets/mmlu



deploy:
  xllm:
    model: qwen35_27b
    draft_model: qwen35_27b_mtp
    visible_devices: auto
    start_port: 18150

    enable_prefix_cache: false
    speculative_tokens: 0
    tp_size: 2
    dp_size: 1
    ep_size: 1
    enable_chunked_prefill: true
    max_tokens_per_chunk_for_prefill: 8192
    max_memory_utilization: 0.85
    max_sequence_length: model_default
    max_tokens_per_batch: 2048
    max_seqs_per_batch: 16
    max_linear_state_cache_slots: 4

benchmark:
  model: qwen35_27b
  cases:
    - name: smoke
      input_len: 1024
      output_len: 128
      concurrency: 1
      num_prompts: 16

    - name: throughput
      input_len: 1024
      output_len: 128
      concurrency: 16
      num_prompts: 256

accuracy:
  model: qwen35_27b
  concurrency: 1
  cases:
    - name: ceval
      dataset: ceval

    - name: mmlu
      dataset: mmlu
